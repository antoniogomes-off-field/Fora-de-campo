<style>
/* Layout: agenda do míster — cabeçalho fixo com data e saldo, ecrã de uma coluna, placard de estádio como peça central, navegação em baixo */
:root{
  --bg:#eef1e8; --surface:#fbfcf7; --fg:#18221b; --muted:#5d6b60; --line:#d4dbcb; --soft:#e3e9dc;
  --relva:#1d5a37; --relva-fg:#f4f7ef; --cartao:#d9a313; --vermelho:#c43d2b; --bom:#2f8a4e;
  --placard:#123321; --placard-fg:#eef3ea; --placard-dim:#9fb5a5; --placard-led:#f2c23a; --tg:#8be3a8; --tb:#ff9b8c;
  --display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --body:'Barlow','Segoe UI',system-ui,sans-serif;
  --cond:'Barlow Condensed','Arial Narrow',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1410; --surface:#151f19; --fg:#e5ece4; --muted:#93a396; --line:#26332b; --soft:#1c2820;
  --relva:#3a9f63; --relva-fg:#06110a; --cartao:#f0c040; --vermelho:#e3604c; --bom:#4cb974;
  --placard:#08170e; --placard-fg:#eef3ea; --placard-dim:#8aa293; --placard-led:#f2c23a; --tg:#1f7a40; --tb:#b3321f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1410; --surface:#151f19; --fg:#e5ece4; --muted:#93a396; --line:#26332b; --soft:#1c2820;
  --relva:#3a9f63; --relva-fg:#06110a; --cartao:#f0c040; --vermelho:#e3604c; --bom:#4cb974;
  --placard:#08170e; --placard-fg:#eef3ea; --placard-dim:#8aa293; --placard-led:#f2c23a; --tg:#1f7a40; --tb:#b3321f; color-scheme:dark}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:15px;line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--cartao);outline-offset:2px}
#app{max-width:560px;margin:0 auto;padding-bottom:96px}
.num{font-variant-numeric:tabular-nums}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding:12px 0 10px;border-bottom:2px solid var(--fg)}
.top .who{min-width:0}
.top .who b{font-family:var(--display);font-size:24px;letter-spacing:.5px;text-transform:uppercase;line-height:1;display:block}
.top .who span{font-family:var(--cond);font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.top .dt{text-align:right;flex-shrink:0}
.top .dt span{font-family:var(--cond);font-size:14px;color:var(--muted);display:block}
.top .dt b{font-family:var(--display);font-size:22px;line-height:1}
.neg{color:var(--vermelho)}
h2.sec{font-family:var(--cond);font-weight:700;font-size:13px;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted);margin:22px 0 8px;display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.stack{display:flex;flex-direction:column;gap:10px}
.slots{display:flex;gap:6px;margin-top:14px}
.slot{flex:1;text-align:center;font-family:var(--cond);font-weight:600;font-size:13px;letter-spacing:1px;text-transform:uppercase;padding:6px 0;border-radius:6px;border:1px dashed var(--line);color:var(--muted)}
.slot.done{background:var(--soft);border-style:solid;text-decoration:line-through}
.slot.now{border:2px solid var(--relva);color:var(--fg)}
.slot.jogo{background:var(--placard);color:var(--placard-led);border-color:var(--placard)}
.need{display:grid;grid-template-columns:78px 1fr 30px;align-items:center;gap:10px;font-size:14px}
.need .lab{font-family:var(--cond);font-weight:600;letter-spacing:.4px}
.need .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.track{height:9px;background:var(--soft);border-radius:5px;overflow:hidden}
.fill{height:100%;border-radius:5px;transition:width .4s}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{font-family:var(--cond);font-size:13px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--fg)}
.chip.bad{background:var(--vermelho);color:#fff}
.chip.warn{background:var(--cartao);color:#1a1405}
.sint{margin-top:10px;font-size:14px;color:var(--vermelho);font-weight:600}
.placard{background:var(--placard);color:var(--placard-fg);border-radius:12px;padding:14px 16px;position:relative;overflow:hidden}
.placard::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1.2px);background-size:6px 6px;pointer-events:none}
.placard .meta{font-family:var(--cond);font-size:13px;letter-spacing:1.4px;text-transform:uppercase;color:var(--placard-dim);display:flex;justify-content:space-between;gap:8px}
.placard .teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin:10px 0 4px}
.placard .tn{font-family:var(--display);font-size:22px;line-height:1.05;text-transform:uppercase;min-width:0;overflow-wrap:anywhere}
.placard .tn.r{text-align:right}
.placard .sc{font-family:var(--display);font-size:40px;color:var(--placard-led);font-variant-numeric:tabular-nums;letter-spacing:2px;line-height:1}
.placard .me{color:var(--placard-led)}
.placard .row{display:flex;gap:8px;margin-top:12px;position:relative;z-index:1;flex-wrap:wrap}
.placard .btn{background:transparent;border:1px solid var(--placard-dim);color:var(--placard-fg)}
.placard .btn.primary{background:var(--placard-led);color:#1a1405;border-color:var(--placard-led)}
.conf{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;margin-top:10px;font-family:var(--cond);font-size:13px;color:var(--placard-dim);position:relative;z-index:1}
.conf .track{background:rgba(255,255,255,.12)}
.cat{font-family:var(--cond);font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.act{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;display:flex;flex-direction:column;gap:2px;min-width:0}
.act b{font-weight:600;font-size:14.5px;line-height:1.2}
.act small{color:var(--muted);font-size:12.5px;line-height:1.25}
.act .tags{display:flex;gap:6px;font-family:var(--cond);font-size:12px;color:var(--muted);margin-top:3px}
.act .tags .e{color:var(--relva);font-weight:700}
.act .tags .en{color:var(--vermelho);font-weight:700}
.act:hover{border-color:var(--relva)}
.act.off{opacity:.45}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:10px 14px;font-weight:600;font-size:14.5px}
.btn.primary{background:var(--relva);color:var(--relva-fg);border-color:var(--relva)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:6px 10px;font-size:13px}
.bigrow{display:grid;grid-template-columns:1.3fr 1fr;gap:8px;margin-top:20px}
.bigrow .btn{padding:14px 10px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs .in{display:flex;max-width:560px;width:100%}
nav.tabs button{flex:1;background:none;border:0;padding:8px 2px;font-family:var(--cond);font-weight:600;font-size:14px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);border-radius:8px}
nav.tabs button.on{color:var(--fg);background:var(--soft)}
.tblw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table.t{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
table.t th{font-family:var(--cond);font-weight:600;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:7px 8px;border-bottom:1px solid var(--soft);white-space:nowrap}
table.t tr:last-child td{border-bottom:0}
table.t .r{text-align:right}
table.t tr.me td{background:var(--soft);font-weight:700}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:var(--soft)}
.pos{font-family:var(--cond);font-weight:700;font-size:12px;padding:1px 6px;border-radius:4px;background:var(--soft)}
.pos.GR{background:var(--cartao);color:#1a1405}.pos.AV{background:var(--vermelho);color:#fff}.pos.MED{background:var(--relva);color:var(--relva-fg)}
.xi{width:6px;height:6px;border-radius:50%;background:var(--relva);display:inline-block;margin-right:5px;vertical-align:middle}
.mini{display:inline-block;width:42px;height:6px;background:var(--soft);border-radius:3px;overflow:hidden;vertical-align:middle}
.mini i{display:block;height:100%}
.seg{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:10px;flex-wrap:wrap}
.seg button{flex:1;border:0;background:transparent;padding:7px 6px;border-radius:7px;font-family:var(--cond);font-weight:600;font-size:14px;min-width:60px}
.seg button.on{background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.kv dt{color:var(--muted)}.kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--soft)}
.opt:last-child{border-bottom:0}
.opt .l{min-width:0}.opt .l b{display:block;font-weight:600}.opt .l small{color:var(--muted)}
.opt .bs{display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}
.tag{font-family:var(--cond);font-weight:700;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--relva)}
.log{display:flex;flex-direction:column}
.log div{padding:9px 0;border-bottom:1px solid var(--soft);font-size:14.5px;display:grid;grid-template-columns:56px 1fr;gap:10px}
.log span{font-family:var(--cond);color:var(--muted);font-size:13px}
.log .good{color:var(--bom)}.log .bad{color:var(--vermelho)}.log .big{font-weight:700}
#modal{position:fixed;inset:0;z-index:20;background:rgba(5,12,8,.55);display:flex;align-items:flex-end;justify-content:center;padding:0 max(10px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:16px;padding:18px 18px 14px;max-height:86vh;overflow:auto;border:1px solid var(--line)}
.sheet h2{font-family:var(--display);text-transform:uppercase;font-size:26px;line-height:1.05;margin:0 0 8px;text-wrap:balance}
.mbody{font-size:15.5px}
.mbody p{margin:0 0 10px}
.mbtns{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.warn{color:var(--vermelho);font-size:14px}
.sheet.match{background:var(--placard);color:var(--placard-fg);border-color:var(--placard)}
.sheet.match h2{color:var(--placard-dim);font-family:var(--cond);font-size:13px;letter-spacing:1.6px}
.sheet.match .btn{background:var(--placard-led);color:#1a1405;border-color:var(--placard-led)}
.mev{list-style:none;padding:0;margin:12px 0 0;display:flex;flex-direction:column;gap:6px;font-size:15px}
.mev li{display:grid;grid-template-columns:38px 1fr;gap:8px;animation:pop .3s ease-out}
.mev li b{font-family:var(--display);color:var(--placard-led);font-size:18px}
.mev .them{color:var(--placard-dim)}
.ytag{display:inline-block;width:9px;height:12px;background:#f2c23a;border-radius:1px;margin-right:4px;vertical-align:-1px}
.rtag{display:inline-block;width:9px;height:12px;background:#e3604c;border-radius:1px;margin-right:4px;vertical-align:-1px}
@keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(74px + env(safe-area-inset-bottom,0px));z-index:15;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14.5px;max-width:min(480px,calc(100% - 32px));text-align:center;box-shadow:0 4px 16px rgba(0,0,0,.25)}
textarea,input,select{font:inherit;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%}
textarea{min-height:110px;font-size:12px;font-family:ui-monospace,Menlo,monospace}
.hero{padding:28px 0 6px}
.hero h1{font-family:var(--display);font-size:56px;line-height:.9;text-transform:uppercase;margin:0;letter-spacing:.5px}
.hero h1 em{font-style:normal;color:var(--relva)}
.hero p{color:var(--muted);max-width:44ch;margin:10px 0 0}
.pitch{height:56px;border:2px solid var(--relva);border-radius:4px;margin:18px 0 4px;position:relative;opacity:.55}
.pitch::before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:2px solid var(--relva)}
.pitch::after{content:"";position:absolute;left:50%;top:50%;width:30px;height:30px;border:2px solid var(--relva);border-radius:50%;transform:translate(-50%,-50%)}
.lg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.lg button{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 4px;font-family:var(--cond);font-weight:600;font-size:14.5px}
.lg button.on{background:var(--relva);color:var(--relva-fg);border-color:var(--relva)}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-family:var(--cond);font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.two{display:grid;grid-template-columns:2fr 1fr;gap:10px}
.clubs .opt{cursor:pointer;padding:10px 10px;border-radius:9px;border-bottom:0}
.clubs .opt.on{background:var(--soft);outline:2px solid var(--relva)}
.empty{color:var(--muted);text-align:center;padding:22px 10px}
/* vida extra */
.ticker{margin-top:12px;background:var(--fg);color:var(--bg);border-radius:8px;overflow:hidden;display:flex;align-items:center;font-family:var(--cond);font-size:14.5px;font-weight:600}
.ticker b{background:var(--vermelho);color:#fff;padding:7px 10px;letter-spacing:1.2px;text-transform:uppercase;font-size:12px;flex-shrink:0;position:relative;z-index:1}
.ticker .rail{overflow:hidden;flex:1;min-width:0}
.ticker .run{display:inline-block;white-space:nowrap;padding-left:100%;animation:run 40s linear infinite}
.ticker .run span{margin-right:48px}
.ticker .run span::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--cartao);margin-right:10px;vertical-align:2px}
@keyframes run{to{transform:translateX(-100%)}}
.phone{padding:2px 14px}
.msg{display:grid;grid-template-columns:34px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--soft)}
.msg:last-child{border-bottom:0}
.msg>div{min-width:0}
.msg .av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:18px;background:var(--relva);color:var(--relva-fg)}
.msg.ad .av{background:var(--cartao);color:#1a1405}
.msg b{font-weight:600}.msg small{color:var(--muted);font-family:var(--cond);margin-left:4px}
.msg p{margin:2px 0 0;font-size:14.5px}
.msg.new{animation:pop .4s ease-out}
.up{color:var(--bom);font-size:11px;margin-left:2px}.dn{color:var(--vermelho);font-size:11px;margin-left:2px}
.fd{display:inline-flex;gap:3px}.fd i{width:8px;height:8px;border-radius:50%;background:var(--muted)}.fd i.V{background:var(--bom)}.fd i.E{background:var(--cartao)}.fd i.D{background:var(--vermelho)}
.flip{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);z-index:18;background:var(--placard);color:var(--placard-fg);font-family:var(--display);font-size:28px;text-transform:uppercase;padding:16px 26px;border-radius:14px;text-align:center;pointer-events:none;animation:flip 1s ease forwards;white-space:nowrap;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.flip small{display:block;font-family:var(--cond);font-size:13px;letter-spacing:2px;color:var(--placard-led)}
@keyframes flip{0%{opacity:0;transform:translate(-50%,-30%)}25%,70%{opacity:1;transform:translate(-50%,-50%)}100%{opacity:0;transform:translate(-50%,-70%)}}
.news{display:flex;flex-direction:column}
.news div{padding:8px 0;border-bottom:1px solid var(--soft);font-size:14.5px}
.news div:last-child{border-bottom:0}
.news span{font-family:var(--cond);color:var(--muted);font-size:13px;margin-right:8px}
.news .good{color:var(--bom)}.news .bad{color:var(--vermelho)}
.hint{color:var(--muted);font-size:13.5px;margin:10px 0 0}
.dl{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:6px}
.dl:first-child{margin-top:0}
.dl i{font-style:normal;font-family:var(--cond);font-weight:600;font-size:13px;padding:1px 8px;border-radius:999px;background:rgba(127,127,127,.22)}
.dl i.p{color:var(--tg)}.dl i.m{color:var(--tb)}
.mtop{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-family:var(--cond);font-size:13px;letter-spacing:1.4px;text-transform:uppercase;color:var(--placard-dim)}
.clock{font-family:var(--display);font-size:28px;color:var(--placard-led);letter-spacing:1px;font-variant-numeric:tabular-nums}
.prog{height:3px;background:rgba(255,255,255,.12);border-radius:2px;margin:6px 0 2px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--placard-led);transition:width .09s linear}
.momw{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;font-family:var(--cond);font-size:12px;color:var(--placard-dim);text-transform:uppercase;letter-spacing:1px;margin-top:4px}
.mom{height:8px;border-radius:4px;background:rgba(255,255,255,.14);overflow:hidden}
.mom i{display:block;height:100%;width:50%;background:var(--placard-led);transition:width .35s}
.mev{max-height:36vh;overflow:auto}
.mev li.goal span{font-weight:700;color:var(--placard-led)}
.mev li.goal.them span{color:#ff9b8c}
.mev li.chance span{color:var(--placard-dim)}
.sc.flash{animation:flash .9s ease-out}
@keyframes flash{0%{transform:scale(1.7);color:#fff;text-shadow:0 0 22px var(--placard-led)}100%{transform:none}}
.htq{margin:14px 0 8px;font-weight:600}
.htb{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.htb .btn{padding:10px 4px;font-size:14px}
.mres{font-family:var(--display);font-size:28px;text-transform:uppercase;margin:12px 0 0}
.mres small{display:block;font-family:var(--body);font-size:14px;text-transform:none;color:var(--placard-dim);margin-top:4px}
/* motor 2D */
.sheet.big{max-width:720px;padding:12px;max-height:94vh}
.sheet.big .mev{max-height:24vh}
.mhead{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin-bottom:6px}
.mhead .tn{font-family:var(--display);font-size:18px;text-transform:uppercase;line-height:1.05;min-width:0;display:flex;align-items:center;gap:6px}
.mhead .tn span{min-width:0;overflow-wrap:anywhere}
.mhead .tn.r{justify-content:flex-end;text-align:right}
.mhead .tn i{width:11px;height:11px;border-radius:50%;flex-shrink:0;border:1px solid rgba(0,0,0,.3)}
.mhead .mid{text-align:center}
.mhead .sc{font-family:var(--display);font-size:40px;color:var(--placard-led);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:1px}

.mhead.tr{grid-template-columns:1fr auto}
.mhead.tr b{font-family:var(--display);font-size:22px;text-transform:uppercase;display:block}
.eyebrow{display:block;font-family:var(--cond);font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:var(--placard-dim)}
.pitchw{position:relative;border-radius:8px;overflow:hidden;margin-top:6px;background:#2a6c3e}

.mctl{display:flex;gap:6px;margin-top:10px;align-items:center;flex-wrap:wrap}
.mctl.end{flex-direction:column;align-items:stretch}
.mctl .btn{padding:8px 14px;font-size:14px}
.sheet.match .btn.alt{background:transparent;color:var(--placard-fg);border-color:rgba(255,255,255,.3)}
.spd{display:flex;background:rgba(255,255,255,.1);border-radius:9px;padding:3px;margin:0 auto}
.spd button{border:0;background:none;color:var(--placard-fg);font-family:var(--cond);font-weight:700;font-size:15px;padding:5px 12px;border-radius:7px}
.spd button.on{background:var(--placard-led);color:#1a1405}
.mpanel{margin-top:10px;display:flex;flex-direction:column;gap:8px}
.mpanel p{margin:0;font-weight:600}
.mpanel .lab{font-family:var(--cond);font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:var(--placard-dim)}
.chipset{display:flex;flex-wrap:wrap;gap:6px}

.chipset button.on{background:var(--placard-led);color:#1a1405;border-color:var(--placard-led)}
.tres{margin-top:12px;display:flex;flex-direction:column;gap:7px;font-size:15px}
.tres .row2{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:baseline}
.tres .k{font-family:var(--cond);font-weight:700;font-size:12px;letter-spacing:1px;text-transform:uppercase;padding:2px 7px;border-radius:4px;text-align:center}
.k.top{background:var(--placard-led);color:#1a1405}.k.bad{background:#e3604c;color:#fff}.k.inf{background:rgba(255,255,255,.15);color:var(--placard-fg)}
/* onze + menu */
.lpitch{position:relative;width:min(100%,400px);aspect-ratio:68/82;margin:10px auto 0;background:repeating-linear-gradient(180deg,#2a6c3e 0 10%,#2f7744 10% 20%);border-radius:12px;overflow:hidden}
.lpitch::before{content:"";position:absolute;inset:4%;border:1.5px solid rgba(255,255,255,.7)}
.lpitch::after{content:"";position:absolute;left:28%;right:28%;bottom:4%;height:15%;border:1.5px solid rgba(255,255,255,.7);border-bottom:0}
.lslot{position:absolute;z-index:1;transform:translate(-50%,-50%);background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;color:#fff;width:24%;padding:0}
.lslot .sh{width:34px;height:34px;border-radius:50%;background:#f2c23a;color:#1a1405;display:grid;place-items:center;font-family:var(--display);font-size:17px;box-shadow:0 2px 4px rgba(0,0,0,.35);border:2px solid rgba(0,0,0,.2);transition:transform .15s}
.lslot .sh.GR{background:#8fd3ff}
.lslot b{font-size:12.5px;font-weight:600;background:rgba(0,0,0,.6);padding:1px 6px;border-radius:4px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lslot small{font-family:var(--cond);font-size:11px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.8);white-space:nowrap}
.lslot.warn .sh{box-shadow:0 0 0 3px #e3604c}
.lslot:hover .sh{transform:scale(1.08)}
.btn.big{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:14px 16px;text-align:left}
.btn.big span{font-family:var(--display);font-size:24px;text-transform:uppercase;line-height:1}
.btn.big small{font-weight:500;opacity:.85;font-size:13.5px}
.top .who[role=button]{cursor:pointer}
/* cenas */
.sheet.scene{max-width:560px}
.eyebrow2{display:block;font-family:var(--cond);font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted)}
.jrow{display:flex;gap:6px;justify-content:space-between;margin:12px 0 14px}
.jn{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;min-width:0;opacity:.45;transition:opacity .25s}

.qb p{margin:4px 0 0;font-size:17px;font-weight:600;line-height:1.35;text-wrap:pretty}

.react{color:var(--muted);font-style:italic;margin:10px 2px 0}

.tone{font-family:var(--cond);font-weight:700;font-size:11px;letter-spacing:1.2px;text-transform:uppercase;padding:1px 7px;border-radius:4px;background:var(--soft);color:var(--muted)}

.heads{display:flex;flex-direction:column;gap:8px}

.paper small{font-family:var(--cond);letter-spacing:1px;text-transform:uppercase;color:var(--muted);font-size:11.5px}
.paper b{display:block;font-family:var(--display);font-size:21px;line-height:1.1;margin-top:2px;text-wrap:balance}

  if(up&&gap>=5)news('Surpresa! '+L[up[0]].n+' vence o '+L[up[1]].n+' por '+Math.max(up[2].hg,up[2].ag)+'–'+Math.min(up[2].hg,up[2].ag)+'.');

function value(p){const af=p.age<23?1.4:p.age<28?1.1:p.age<31?0.8:0.45;return 1000*Math.pow(1.32,p.ovr-50)*af}

function genMarket(){if(S.job&&S.job.nt)return [];const b=S.job?S.ratings[S.job.lg][S.job.club].r:62;if(S.real&&S.job){const own=new Set(S.squad.map(p=>p.n)),tk=new Set(S.taken||[]),pool=[];for(const k of TOP)S.ratings[k].forEach(t=>{if(t.n===clubName())return;(REALDB[t.n]||[]).forEach(e=>{if(!own.has(e.n)&&!tk.has(e.n)&&e.ovr>=b-6&&e.ovr<=b+5&&e.age<35)pool.push([e,t.n])})});if(pool.length>=8){const dy=Math.max(0,curSeasonYear()-2026);return shuffle(pool).slice(0,16).map(([e,c])=>{const p=realPlayer(e,dy);if(!p)return null;p.price=priceOf(p);p.from=c;return p}).filter(Boolean).sort((a,b)=>b.ovr-a.ovr)}}const L=TOP,out=[];for(let i=0;i<16;i++){const p=genPlayer(pick(['GR','DEF','DEF','MED','MED','AV','AV']),b+ri(-6,6),pick(L));p.price=priceOf(p);out.push(p)}return out.sort((a,b)=>b.ovr-a.ovr)}
const salaryFor=r=>Math.round(3000*Math.pow(1.18,r-60)/100)*100;
const budgetFor=r=>Math.round(200000*Math.pow(1.25,r-60)/1000)*1000;
function windowOpen(){const m=dt(S.day).getUTCMonth();return m===6||m===7||m===0}

function slotsOf(form){const[d,m,a]=FORMS[form];return['GR',...Array(d).fill('DEF'),...Array(m).fill('MED'),...Array(a).fill('AV')]}
const penOf=(p,pos)=>p.pos===pos?0:(pos==='GR'||p.pos==='GR'?20:7);
function manualRaw(base){const sl=slotsOf(S.form),used=new Set(),xi=[],miss=[],sc=p=>base?p.ovr:p.ovr*(0.7+0.3*p.fit/100);
 sl.forEach((pos,i)=>{const p=S.squad.find(q=>q.id===S.xiIds[i]);if(p&&!p.inj&&!p.out&&!used.has(p.id)){used.add(p.id);xi[i]={p,pos,pen:penOf(p,pos)}}else miss.push(i)});
 miss.forEach(i=>{const pos=sl[i],av=S.squad.filter(p=>!p.inj&&!p.out&&!used.has(p.id)),c=av.filter(p=>p.pos===pos).sort((x,y)=>sc(y)-sc(x))[0]||av.sort((x,y)=>sc(y)-sc(x))[0];if(c){used.add(c.id);xi[i]={p:c,pos,pen:penOf(c,pos),auto:true}}});
 return sl.map((_,i)=>xi[i]||null)}
function xiSlots(){if(S.xiManual&&S.xiIds)return manualRaw(false);const sl=slotsOf(S.form),pool=[...pickXI(false)];return sl.map(r=>{const k=pool.findIndex(x=>x.pos===r);return k>=0?pool.splice(k,1)[0]:null})}
function ensureManual(){if(S.xiManual&&S.xiIds)return;S.xiIds=xiSlots().map(x=>x?x.p.id:null);S.xiManual=true}
function reformXI(f){if(S.xiManual&&S.xiIds){const ord={GR:0,DEF:1,MED:2,AV:3},ps=xiSlots().filter(Boolean).map(x=>x.p),gk=ps.find(p=>p.pos==='GR')||ps[0],rest=ps.filter(p=>p!==gk).sort((a,b)=>ord[a.pos]-ord[b.pos]||b.ovr-a.ovr);S.form=f;S.xiIds=[gk,...rest].filter(Boolean).map(p=>p.id).slice(0,11)}else S.form=f}
function chooseXI(i){ensureManual();const sl=slotsOf(S.form),role=sl[i],SL=xiSlots(),at=new Map();SL.forEach((x,j)=>{if(x)at.set(x.p.id,j)});
 const L=S.squad.filter(p=>!p.inj).sort((a,b)=>(b.pos===role)-(a.pos===role)||b.ovr-a.ovr);
 modal('Escolher '+{GR:'o guarda-redes',DEF:'um defesa',MED:'um médio',AV:'um avançado'}[role],'<p>Lugar de <b>'+role+'</b>. Quem joga fora da posição natural rende menos. Os lesionados não aparecem.</p>',
  L.map(p=>{const j=at.get(p.id);return{l:p.pos+' · '+p.n+' · '+p.ovr+' · forma '+Math.round(p.fit)+'%'+(p.out?' · fora da convocatória':'')+(j===i?' · atual':j!=null?' · no onze (troca)':''),f(){const ids=SL.map(x=>x?x.p.id:null),old=ids[i];if(j!=null&&j!==i)ids[j]=old;ids[i]=p.id;S.xiIds=ids;p.out=false;toast(p.n+' entra no onze.')}}}).concat([{l:'Cancelar',ghost:true}]))}
function pickXI(base){if(S.xiManual&&S.xiIds)return manualRaw(base).filter(Boolean);const[d,m,a]=FORMS[S.form];const need={GR:1,DEF:d,MED:m,AV:a};const av=S.squad.filter(p=>!p.inj&&!p.out);const sc=p=>base?p.ovr:p.ovr*(0.7+0.3*p.fit/100);const used=new Set(),xi=[];
 for(const pos in need){const c=av.filter(p=>p.pos===pos).sort((x,y)=>sc(y)-sc(x));for(let i=0;i<need[pos]&&i<c.length;i++){used.add(c[i].id);xi.push({p:c[i],pos,pen:0})}}
 for(const pos in need){let have=xi.filter(x=>x.pos===pos).length;while(have<need[pos]){const c=av.filter(p=>!used.has(p.id)).sort((x,y)=>sc(y)-sc(x))[0];if(!c)break;used.add(c.id);xi.push({p:c,pos,pen:pos==='GR'?20:7});have++}}
 return xi}
function strength(base){const xi=pickXI(base);let s=0;xi.forEach(x=>{s+=(base?x.p.ovr:x.p.ovr*(0.75+0.25*x.p.fit/100)+(x.p.mor-60)/20)-x.pen+(x.p.tr==='lid'?3:0)});return s/11}
function coachMod(){return (S.n.energia-50)/50-(S.n.stress-50)/60+(S.prep-50)/40+(S.analise?1:0)-(hasCond('burnout')?2:0)-(hasCond('ressaca')?1.5:0)}

function curSeasonYear(){const x=dt(S.day);return x.getUTCMonth()>=6?x.getUTCFullYear():x.getUTCFullYear()-1}
function seasonStartDay(y){let d=Math.round((Date.UTC(y,7,8)-DAY0)/864e5);while(dt(d).getUTCDay()!==6)d++;return d}
function setupSeason(lg,y){S.leagueId=lg;const N=S.ratings[lg].length;let arr=[...Array(N).keys()];const rounds=[],hc={},lv={};
 for(let k=0;k<N-1;k++){const ms=[];for(let i=0;i<N/2;i++){let h=arr[i],a=arr[N-1-i];const sc=t=>(hc[t]||0)*2+(lv[t]==='H'?3:0);if(sc(h)>sc(a)||(sc(h)===sc(a)&&R()<0.5))[h,a]=[a,h];hc[h]=(hc[h]||0)+1;lv[h]='H';lv[a]='A';ms.push([h,a])}rounds.push(ms);arr=[arr[0],arr[N-1],...arr.slice(1,N-1)]}
 const all=rounds.concat(rounds.map(ms=>ms.map(([h,a])=>[a,h])));const st=seasonStartDay(y);S.fixtures=[];
 const skip=new Set([wd(y,9,4,5)+1,wd(y,10,9,5)+1,wd(y,11,13,5)+1,wd(y+1,3,26,5)+1,wd(y,12,26,6)]);let dd=st;all.forEach((ms,r)=>{while(skip.has(dd))dd+=7;const d=dd;dd+=7;ms.forEach(([h,a])=>S.fixtures.push({r,d,h,a,hg:null,ag:null}))});
 S.seasonYear=y;S.seasonClosed=false}
function teamRating(i){if(S.job&&S.job.lg===S.leagueId&&i===S.job.club)return strength(true);return S.ratings[S.leagueId][i].r}
function simAI(f){const rh=teamRating(f.h)+1.5,ra=teamRating(f.a);f.hg=poisson(xg(rh,ra));f.ag=poisson(xg(ra,rh))}
function simPast(){S.fixtures.forEach(f=>{if(f.d<S.day&&f.hg===null)simAI(f)});if(S.fixtures.every(f=>f.hg!==null))S.seasonClosed=true}
function table(){const T=S.ratings[S.leagueId].map((t,i)=>({i,n:t.n,j:0,v:0,e:0,d:0,gm:0,gs:0,p:0}));
 S.fixtures.forEach(f=>{if(f.hg===null)return;const h=T[f.h],a=T[f.a];h.j++;a.j++;h.gm+=f.hg;h.gs+=f.ag;a.gm+=f.ag;a.gs+=f.hg;if(f.hg>f.ag){h.v++;h.p+=3;a.d++}else if(f.hg<f.ag){a.v++;a.p+=3;h.d++}else{h.e++;a.e++;h.p++;a.p++}});
 return T.sort((x,y)=>y.p-x.p||(y.gm-y.gs)-(x.gm-x.gs)||y.gm-x.gm)}
function objectiveFor(lg,club){const L=S.ratings[lg];const rank=[...L.keys()].sort((a,b)=>L[b].r-L[a].r).indexOf(club)+1;const N=L.length;if(LEAGUES[lg]&&LEAGUES[lg].tier===2){if(rank<=4)return{t:'Subir de divisão',p:3};if(rank<=10)return{t:'Lutar pela subida (top 6)',p:6};return{t:'Evitar a descida',p:N-3}}
 if(rank===1)return{t:'Ser campeão',p:1};if(rank<=4)return{t:'Lugar europeu (top 4)',p:4};if(rank<=8)return{t:'Primeira metade da tabela',p:Math.floor(N/2)};return{t:'Evitar a despromoção',p:N-3}}

 const p=genPlayer(e.pos,ovr,'pt');p.n=e.n;p.age=age;p.ovr=ovr;p.pot=Math.max(ovr,potOf(age,ovr));p.p0=p.pot;p.real=1;return p}

function quickTab(k){const L=S.ratings[k],N=L.length,P=L.map(()=>0),GD=L.map(()=>0);for(let i=0;i<N;i++)for(let j=0;j<N;j++){if(i===j)continue;const rh=L[i].r+1.5,ra=L[j].r,h=poisson(xg(rh,ra)),a=poisson(xg(ra,rh));GD[i]+=h-a;GD[j]+=a-h;if(h>a)P[i]+=3;else if(a>h)P[j]+=3;else{P[i]++;P[j]++}}
 return L.map((t,i)=>({n:t.n,p:P[i],gd:GD[i]})).sort((a,b)=>b.p-a.p||b.gd-a.gd).map(o=>o.n)}

function swapClub(a,b){const A=CIDX[a],B=CIDX[b];if(!A||!B)return;S.ratings[A.lg][A.i]=B.o;S.ratings[B.lg][B.i]=A.o;CIDX[a]={lg:B.lg,i:B.i,o:A.o};CIDX[b]={lg:A.lg,i:A.i,o:B.o};
 const mv=o=>{if(o.lg===A.lg&&o.club===A.i){o.lg=B.lg;o.club=B.i;return -1}if(o.lg===B.lg&&o.club===B.i){o.lg=A.lg;o.club=A.i;return 1}return 0};

 if(S.mode==='player'){S.staff.unshift({...staffGen(r,'tp'),n:pick(PNM.m)+' '+pick(NAMES.pt.l)})}}

 const inc=(S.news||[]).filter(n=>n.k==='msg'&&n.from===from).slice(0,8).reverse();inc.forEach(n=>{n.id=n.id||(S.uid++);if(!L.some(m=>m.id===n.id))L.push({w:'p',t:n.t,d:n.d,id:n.id})});L.sort((a,b)=>a.d-b.d);if(L.length>40)L.splice(0,L.length-40);
 const pend=(S.news||[]).find(n=>n.k==='msg'&&n.from===from&&!n.ans);CHAT={from,type,stage:pend?1:0,pend,mood:pend?msgMood(pend.t):null,typing:0};renderChat()}
function chatOpts(){const c=CHAT;if(c.typing)return[];if(c.stage===1)return RPL[c.mood].map(([t,tone])=>({t,tone}));if(c.stage===2)return(CT[c.type]||CT.outro).f2.map(([t,tone])=>({t,tone}));
 if(c.stage===0&&['mae','pai','par','amigo','filho','irmao','amante','ex'].includes(c.type))return[{t:{mae:'Olá mãe, como estás? ❤️',pai:'Olá pai, tudo bem?',par:'Tenho saudades tuas ❤️',amigo:'Então mano, tudo bem? Bora combinar algo?',filho:'Olá campeão! Como correu a escola?',irmao:'Então, como vai isso?',amante:'Preciso de te ver.',ex:'Olá. Como estás?'}[c.type],tone:'w',fresh:1}];return[]}
function renderChat(){modalOpen=true;const c=CHAT,L=chatLog(c.from),box=$('#modal'),O=chatOpts();
 box.innerHTML=`<div class="sheet scene sms" role="dialog" aria-modal="true" aria-label="Mensagens com ${esc(c.from)}"><div class="smsh"><span class="av">${esc(ini(c.from.replace(/[()]/g,'')))}</span><div><b>${esc(c.from)}</b><small>${c.typing?'a escrever…':'online'}</small></div></div>
 <div class="chat" id="bchat">${L.map(m=>`<div class="bub ${m.w}">${esc(m.t)}</div>`).join('')}${c.typing?'<div class="bub p typing"><i></i><i></i><i></i></div>':''}</div>
 <div class="mbtns">${O.map((o,k)=>`<button class="btn ans" data-sms="${k}">${esc(o.t)}</button>`).join('')}${c.typing?'':`<button class="btn ghost" data-do="smsclose">${O.length?'Responder mais tarde':'Fechar'}</button>`}</div></div>`;
 box.hidden=false;const ch=$('#bchat');if(ch)ch.scrollTop=ch.scrollHeight}

 if(c.pend){(S.news||[]).forEach(n=>{if(n.k==='msg'&&n.from===c.from)n.ans=1});c.pend=null}const T=CT[c.type]||CT.outro;let reply;
 if(c.stage===2){reply=pick(T.end[o.tone==='w'?'w':'n'])}else{reply=pick(T[o.fresh?'w':o.tone])}
 c.typing=1;renderChat();setTimeout(()=>{if(CHAT!==c)return;c.typing=0;L.push({w:'p',t:reply,d:S.day});c.stage=c.stage===2?3:(o.tone==='c'?3:2);save();renderChat()},900+Math.min(1400,reply.length*18))}

function buyHouse(id,loan){if(S.age<18)return toast('Só a partir dos 18 anos.');const h=HOUSES.find(x=>x.id===id);const resale=S.house.own?HOUSES.find(x=>x.id===S.house.id).compra*0.95-(S.house.loan?S.house.loan.left:0):0;
 if(!loan){if(S.money+resale<h.compra)return toast('Não tens dinheiro suficiente.');sellHouse();S.money-=h.compra;S.house={id,own:true,loan:null}}
 else{const ent=h.compra*0.15,m=Math.round(h.compra*0.85/300*1.25);const inc=S.job?S.job.salary:(isPro()&&S.pl.con?S.pl.con.sal:0);if(!inc)return toast(S.mode==='player'?'O banco precisa de um salário fixo. Assina primeiro um contrato profissional.':'O banco não empresta a quem está sem emprego.');if(inc<m*2.5)return toast('O banco recusou: a prestação ('+money(m)+') é alta para o teu salário ('+money(inc)+').');if(S.money+resale<ent)return toast('Precisas de '+money(ent)+' de entrada.');
  sellHouse();S.money-=ent;S.house={id,own:true,loan:{left:h.compra*0.85,m}}}
 add('felicidade',8);log('Compraste: '+h.n+'.','good');save();render()}

 ${pl?`<p class="hint" style="margin:0">Começas na formação aos 8 anos. Até aos Sub-15 as épocas passam depressa. Nos Sub-17 e Sub-19 jogas metade dos jogos e podes ser chamado à equipa principal. Depois dos 35 podes passar a treinador.</p>`:''}
 <div class="two"><div class="field"><label for="nome">O teu nome</label><input id="nome" value="${esc(setup.name||'Antonio')}" maxlength="22"></div>${pl?'':`<div class="field"><label for="idade">Idade</label><input id="idade" type="number" min="25" max="55" value="${setup.age||32}"></div>`}</div>
 ${pl?`<div class="field"><label>Nacionalidade</label><div class="chipset2">${LEAGUES.NT.t.map(t=>t[0]).sort((a,b)=>a.localeCompare(b,'pt')).map(n=>`<button data-snat="${n}" class="${(setup.nat||'Portugal')===n?'on':''}">${n}</button>`).join('')}</div></div>`:''}
 ${pl?`<div class="field"><label>Posição</label><div class="seg">${Object.entries(POSN).map(([k,l])=>`<button data-spos="${k}" class="${(setup.pos||'AV')===k?'on':''}">${l}</button>`).join('')}</div></div>`:''}
 <div class="field"><label>Campeonato</label><div class="lg">${PLAY.map(k=>`<button data-lg="${k}" class="${setup.lg===k?'on':''}">${LEAGUES[k].n}</button>`).join('')}</div></div>
 <div class="field"><label>${pl?'Clube da tua formação · qualquer clube':'Clube inicial · só os mais modestos aceitam um treinador sem nome'}</label><div class="card clubs" style="padding:6px;${pl?'max-height:340px;overflow:auto':''}">${L.map(c=>`<div class="opt ${setup.club===c.i?'on':''}" data-club="${c.i}" role="button" tabindex="0"><div class="l"><b>${esc(c.n)}</b><small>${pl?(c.r>=82?'Formação muito exigente, poucos minutos':c.r>=74?'Boa formação':'Mais minutos para os jovens'):'Salário '+money(salaryFor(c.r))+'/mês'}</small></div><span class="tag">Força ${c.r}</span></div>`).join('')}</div></div>
 <button class="btn primary" data-do="start" style="padding:14px">${pl?'Começar aos 8 anos':'Começar carreira'} · espaço ${setup.slot||1}</button></div>`}
function bindSetup(){}
function readSetupInputs(){const n=$('#nome'),a=$('#idade');if(n)setup.name=n.value;if(a)setup.age=a.value}

/* ============ EVENTOS DOM ============ */
document.addEventListener('click',e=>{const t=e.target.closest('button,[data-club],tr[data-p],tr[data-osq],tr[data-offer]');if(!t)return;const d=t.dataset;
 if(d.do==='instalar'){const ip=window.FDC_INST;if(ip){ip.prompt();ip.userChoice.then(()=>{window.FDC_INST=null;render()}).catch(()=>{})}else toast('Abre o menu do Chrome (⋮) e escolhe «Instalar app».');return}
 if(d.do==='opcoes'){optionsModal();return}if(d.do==='sairapp'){if(window.fdcApp)fdcApp.quit();return}
 if(!S){if(d.do==='cont'){loadSlot(lastSlot());return}if(d.do==='load'){loadSlot(+d.sv);return}if(d.do==='back'){SCREEN='menu';render();return}if(d.do==='newin'){setup.slot=+d.sv;SCREEN='setup';render();window.scrollTo(0,0);return}
  if(d.do==='del'){const i=+d.sv;modal('Apagar o espaço '+i+'?','<p>Esta carreira perde-se para sempre.</p>',[{l:'Apagar',f(){try{localStorage.removeItem(SK(i))}catch(e){}}},{l:'Cancelar',ghost:true}]);return}
  if(d.do==='newgame'){modal('Novo jogo','<p>Onde queres gravar a nova carreira?</p>',[1,2,3,4,5].map(i=>{const g=slotSum(i);return{l:'Espaço '+i+(g?' · substituir '+g.t:' · vazio'),f(){if(g)setTimeout(()=>modal('Substituir o espaço '+i+'?','<p>A carreira '+esc(g.t)+' vai ser apagada.</p>',[{l:'Substituir',f(){setup.slot=i;SCREEN='setup';window.scrollTo(0,0)}},{l:'Cancelar',ghost:true}]),30);else{setup.slot=i;SCREEN='setup';window.scrollTo(0,0)}}}}).concat([{l:'Cancelar',ghost:true}]));return}
  readSetupInputs();if(d.snat){setup.nat=d.snat;render()}else if(d.smode){setup.mode=d.smode;setup.club=null;render()}else if(d.spos){setup.pos=d.spos;render()}else if(d.lg){setup.lg=d.lg;setup.club=null;render()}else if(d.club){setup.club=+d.club;render()}else if(d.do==='start'){const nm=(setup.name||'').trim()||'Antonio';const ag=cl(parseInt(setup.age)||32,25,55);if(setup.mode==='player')newPlayerGame(nm,setup.lg,setup.club,setup.pos||'AV');else newGame(nm,ag,setup.lg,setup.club)}return}
 if(d.dec!=null&&d.dec!==''&&M&&M.dec)return resolveDec(+d.dec);
 if(d.cel!=null&&d.cel!==''&&M&&M.pk==='cel'&&M.paused)return celPick(+d.cel);
 if(d.offer){const[a,b,...n]=d.offer.split('|');closeModal();return offerModal(a,+b,n.join('|'))}
 if(d.osq){const[a,b]=d.osq.split('|');return squadModal(a,+b)}
 if(d.chat!=null&&d.chat!==''){return openChat(d.chat)}if(d.sms!=null&&d.sms!==''&&CHAT)return smsPick(+d.sms);if(d.do==='smsclose'){CHAT=null;closeModal();render();return}
 if(d.stf){closeP();return staffTalk(+d.stf)}if(d.clin)return sendClinic(+d.clin);
 if(d.kid){const[i,k]=d.kid.split('|');closeP();return k==='play'?kidPlay(+i):k==='shop'?kidShop(+i):kidSchool(+i)}
 if(d.ppl){closeP();return personGo(d.ppl)}
 if(d.do==='stfhire')return staffHire();if(d.do==='pplhub')return peopleHub();if(d.do==='kidshub')return kidsHub();if(d.do==='affair')return affairHub();
 if(d.expl){EXPL=d.expl;return render()}
 if(d.inv){const[k,a]=d.inv.split('|');return invBuy(k,+a)}
 if(d.invs!=null&&d.invs!=='')return invSell(+d.invs);
 if(d.sc!=null&&d.sc!==''&&SCN&&!SCN.end)return sceneOpt(+d.sc);
 if(d.promo){const p=S.yth.find(x=>x.id===+d.promo);if(!p)return;if(S.squad.length>=30)return toast('O plantel está cheio (30).');S.yth=S.yth.filter(x=>x!==p);p.mor=70;p.p0=p.pot;S.squad.push(p);log(p.n+' promovido à equipa principal.','good');news(clubName()+' promove '+p.n+' à equipa principal.',p.son?'good':'jornal');if(p.son){S.familia=cl(S.familia+10);add('felicidade',10)}save();return render()}
 if(d.disp){const p=S.yth.find(x=>x.id===+d.disp);if(!p)return;S.yth=S.yth.filter(x=>x!==p);if(p.son){S.familia=cl(S.familia-15);news('Dispensaste o teu próprio filho da formação.','bad')}toast(p.n+' foi dispensado.');save();return render()}
 if(d.pa!=null&&d.pa!==''&&PC&&PC.stage==='q')return pAnswer(+d.pa);
 if(d.ba&&BM)return boardAct(d.ba);
 if(M){if(d.spd){M.speed=+d.spd;document.querySelectorAll('.spd button').forEach(b=>b.classList.toggle('on',+b.dataset.spd===M.speed));return}
  if(d.mode){M.mode=d.mode;note('Alteração tática: '+MODES.find(x=>x[0]===d.mode)[1]+'.');panel(M.pk);return}
  if(d.mform){setForm(d.mform);note('Mudança para '+d.mform+'.');panel(M.pk);return}}
 if(d.tab){TAB=d.tab;render();window.scrollTo(0,0);return}
 if(d.act)return doAction(d.act);
 if(d.talk)return playMatch(d.talk);
 if(d.form){reformXI(d.form);save();return render()}
 if(d.xim){if(d.xim==='auto')S.xiManual=false;else ensureManual();save();return render()}
 if(d.xs!=null&&d.xs!==''){return chooseXI(+d.xs)}if(d.tact){S.tact=d.tact;save();return render()}if(d.int){S.intens=d.int;save();return render()}
 if(d.p)return playerModal(+d.p);if(d.buy)return buyPlayer(+d.buy);
 if(d.rent)return rentHouse(d.rent);if(d.buyh)return buyHouse(d.buyh,false);if(d.loan)return buyHouse(d.loan,true);if(d.car)return buyCar(d.car);
 switch(d.do){
  case 'sleep':if(matchPending())return toast(S.mode==='player'?'Joga ou simula o jogo primeiro.':'Escolhe a palestra no placard para ir para o jogo.');if(endDay()){flip();render();window.scrollTo(0,0)}break;
  case 'skip':skip();break;
  case 'scclose':SCN=null;closeModal();render();break;
  case 'ystep':yStep();break;
  case 'pplay':proMatch(true);break;
  case 'psim':proMatch(false);break;
  case 'retire':retireFlow(false);break;
  case 'menu':save();S=null;SCREEN='menu';TAB='hoje';render();window.scrollTo(0,0);break;
  case 'mskip':fastForward();break;
  case 'pausa':pauseMenu();break;
  case 'opcoes':optionsModal();break;
  case 'instalar':if(window.FDC_INST){FDC_INST.prompt();FDC_INST.userChoice.then(()=>{window.FDC_INST=null;render()})}break;
  case 'sairapp':if(window.fdcApp)fdcApp.quit();break;
  case 'm3d':G3.setPref(!G3.pref());if(M)view3();break;
  case 'mtac':if(M&&!M.done){M.paused=true;panel('tac')}break;
  case 'mres':if(M&&!M.done){M.paused=false;panel(null)}break;
  case 'm2h':startSecondHalf();break;
  case 'mclose':cancelAnimationFrame(RAF);M=null;closeModal();render();break;
  case 'tskip':if(TR&&!TR.done){TR.t=TR.dur;trainEnd()}break;
  case 'tclose':closeTraining();break;
  case 'mpress':cancelAnimationFrame(RAF);M=null;closeModal();render();pressRoom('pos');break;
  case 'pnext':if(PC)pNext();break;
  case 'pclose':PC=null;closeModal();render();break;
  case 'propose':propose();break;case 'breakup':breakUp();break;
  case 'block':S.blocked=S.day+90;log('Pediste autoexclusão do jogo online por 90 dias.','good');S.vicio=cl(S.vicio-5);save();render();break;
  case 'export':{const code=btoa(unescape(encodeURIComponent(JSON.stringify(S))));modal('Exportar jogo','<p>Copia este código e guarda-o. Usa “Importar” noutro aparelho.</p><textarea id="expc" readonly>'+code+'</textarea>',[{l:'Copiar código',f(){try{navigator.clipboard.writeText(code).then(()=>toast('Código copiado.'),()=>toast('Seleciona o texto e copia à mão.'))}catch(_){toast('Seleciona o texto e copia à mão.')}}},{l:'Fechar',ghost:true}]);break}
  case 'import':modal('Importar jogo','<p>Cola aqui o código exportado. O jogo atual será substituído.</p><textarea id="impc"></textarea>',[{l:'Carregar',f(){}},{l:'Cancelar',ghost:true}]);{const b=$('#modal .mbtns button');b.onclick=()=>{try{const v=JSON.parse(decodeURIComponent(escape(atob($('#impc').value.trim()))));if(!v||!v.n||!v.ratings)throw 0;const sl=S.slot||1;S=v;S.slot=sl;migrate();closeModal();save();TAB='hoje';render();toast('Jogo carregado.')}catch(_){toast('Código inválido. Confirma que copiaste tudo.')}}}break;
  case 'new':modal('Começar de novo?','<p>Perdes a carreira atual neste aparelho.</p>',[{l:'Sim, novo jogo',f(){S=null;try{localStorage.removeItem(KEY)}catch(_){}}},{l:'Cancelar',ghost:true}]);break}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.club){e.target.click()}});
document.addEventListener('input',e=>{if(!S)readSetupInputs()});

/* ============ ARRANQUE ============ */
function start(data){migrateOld();S=(data&&data.S)||null;if(S)migrate();SCREEN='menu';render()}
window.claude?.hot?.snapshot?.(()=>({S}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
